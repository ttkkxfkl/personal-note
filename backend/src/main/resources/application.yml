server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: personal-note-backend
  
  # 数据库配置 - 生产环境使用MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/personal_note?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  
  # JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true

# 日志配置
logging:
  level:
    com.personalnote: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  # 使用H2内存数据库便于开发测试
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.personalnote: INFO
    org.springframework.web: WARN

# 文件上传配置
file:
  upload:
    upload-path: uploads/
    thumbnail-path: uploads/thumbnails/
    max-file-size: 52428800  # 50MB
    max-request-size: 104857600  # 100MB
    allowed-types:
      - image/jpeg
      - image/png 
      - image/gif
      - image/webp
      - application/pdf
      - text/plain
      - text/markdown

# AI配置
ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    max-tokens: 4096
    temperature: 0.7
    timeout: 30000  # 30秒
  default-model: gpt-3.5-turbo
  enabled: true
  rate-limit:
    requests-per-minute: 60
    requests-per-hour: 1000